# Static server of the advisor remote. The shell (another origin) downloads remoteEntry.js and
# the chunks from here, so every file is served with CORS for GET; remoteEntry.js is never
# cached because it decides which version of the portal the browser loads (Annex H rule 4);
# hashed assets cache for a year. Nothing is proxied and no route falls back to index.html:
# the portal has no document of its own in the product (index.html is the standalone dev page).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"qone-advisor-portal"}';
    }

    location = /remoteEntry.js {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
