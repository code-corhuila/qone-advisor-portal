name: CI
on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (TypeScript strict)
        run: npm run typecheck
      - name: Unit, component, integration and contract tests
        run: npm test
      - name: Build the remote
        run: npm run build
        env:
          VITE_SHELL_URL: http://shell.invalid
      - name: The built portal knows no gateway and handles no token (norm 5.4.1, Annex H)
        run: npm run check:isolation
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t qone-advisor-portal:ci .
      - name: Run it and smoke-check it
        run: |
          docker run -d --rm --name portal-ci -p 5005:80 qone-advisor-portal:ci
          for i in $(seq 1 20); do curl -fs http://localhost:5005/health && break; sleep 1; done
          sh deploy/smoke.sh http://localhost:5005
          docker stop portal-ci
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fail on a known high or critical vulnerability in the dependencies (HU-PLT-005)
        # Gates what ships to the browser; the dev-only vitest 3.2.x findings wait for the vitest 4 upgrade, tracked separately.
        run: npm audit --omit=dev --audit-level=high
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if a secret was ever committed, whole history (gitleaks, HU-PLT-005)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
